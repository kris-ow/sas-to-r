project:
  type: website
  output-dir: _site
  resources:
    - assets

website:
  title: "SAS to R"
  description: "SAS programming tasks mapped to R."
  site-url: https://kris-ow.github.io/sas-to-r/
  repo-url: https://github.com/kris-ow/sas-to-r
  favicon: assets/favicon.png
  image: assets/og.png
  image-alt: "SAS to R. SAS programming tasks mapped to R."
  open-graph:
    image-width: 1920
    image-height: 1080
  twitter-card:
    card-style: summary_large_image
    image-width: 1920
    image-height: 1080
  search:
    location: navbar
    type: textbox
    copy-button: true
    keyboard-shortcut:
      - "/"
      - "s"
  navbar:
    pinned: true
    left:
      - href: cheatsheet.qmd
        text: Cheat sheet
      - href: about.qmd
        text: About
  page-footer:
    center: "&copy; 2026 Krzysztof Owczarek, [k.owczarek84@gmail.com](mailto:k.owczarek84@gmail.com)"

format:
  html:
    # Disable Pandoc's smart typography. Without this it silently converts
    # straight quotes to curly ones and -- to an en dash at render time, so an
    # all-ASCII source still publishes non-keyboard characters. See README.
    from: markdown-smart
    # Same Bootswatch base in both modes. Cosmo vs darkly was shifting
    # fonts, heading sizes, and navbar padding on every theme toggle.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    # Adaptive atom-one: light tokens on paper, dark tokens on slate.
    # Do not flatten code to a single grey; keep skylighting colors.
    highlight-style: atom-one
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
          <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
          <link rel="alternate icon" href="assets/favicon.ico">
          <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    include-after-body:
      - file: _theme-switch.html

execute:
  echo: true
  warning: true
  message: false
