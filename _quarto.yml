project:
  type: website
  output-dir: _site

website:
  title: "SAS to R"
  description: "A practical reference for SAS programmers writing R."
  site-url: https://kris-ow.github.io/sas-to-r/
  repo-url: https://github.com/kris-ow/sas-to-r
  search:
    location: navbar
    type: textbox
    copy-button: true
    keyboard-shortcut:
      - "/"
      - "s"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: cheatsheet.qmd
        text: Cheat sheet
    right:
      - icon: github
        href: https://github.com/kris-ow/sas-to-r
        aria-label: Source on GitHub
  sidebar:
    style: floating
    search: false
    contents:
      - href: index.qmd
        text: Home
      - href: cheatsheet.qmd
        text: Cheat sheet
      - section: "Combining data"
        contents:
          - joins.qmd
  page-footer:
    center: "Questions or corrections: [sham4n@gmail.com](mailto:sham4n@gmail.com)"

format:
  html:
    # Disable Pandoc's smart typography. Without this it silently converts
    # straight quotes to curly ones and -- to an en dash at render time, so an
    # all-ASCII source still publishes non-keyboard characters. See README.
    from: markdown-smart
    theme: [darkly, theme.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: atom-one-dark
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

execute:
  echo: true
  warning: true
  message: false
